name: Mobile Preview Demo Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: mobile-preview-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Mobile Preview Tool
        run: npm run build

      - name: Run Mobile Preview Detection on Demo App
        run: node ../dist/cli.js detect --json
        working-directory: demo

      - name: Mobile Preview Publish on Demo App
        run: node ../dist/cli.js publish
        working-directory: demo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
